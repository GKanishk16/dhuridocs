[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dhuridocs"
version = "0.1.0"
description = "A GenAI document intelligence prototype for Indian vehicle loan origination"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Kanishk Gupta"}]
license = {text = "MIT"}
dependencies = ["streamlit>=1.35", "pydantic>=2.7", "python-dotenv>=1.0", "PyYAML>=6.0", "Pillow>=10.0", "reportlab>=4.2", "rapidfuzz>=3.9", "openai>=1.30", "anthropic>=0.28", "pandas>=2.2", "pypdf>=4.2", "PyMuPDF>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
